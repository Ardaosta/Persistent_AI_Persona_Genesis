[project]
name = "genesis-headlines"
version = "0.0.1"
description = "Genesis HEADLINES: per-cluster orientation that survives name-drift, with a drift-proof resolver and an engine-agnostic surfacing step."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
genesis-headlines = "genesis_headlines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_headlines"]
