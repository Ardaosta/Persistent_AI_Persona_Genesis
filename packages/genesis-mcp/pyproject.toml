[project]
name = "genesis-mcp"
version = "0.0.1"
description = "Genesis over MCP: expose an agent's own vault to any MCP client on the same machine, so the person gets the same companion on every surface."
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_mcp"]
